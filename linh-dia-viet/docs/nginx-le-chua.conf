# Ghép "Lễ chùa từ xa" vào cùng domain với trang Kinh Dịch (tuandv.id.vn/kinhdich) — đặt trong server { } của tuandv.id.vn.
# API chạy bằng docker compose trên cùng máy, cổng 8000. Đặt PUBLIC_BASE_URL=https://tuandv.id.vn, APP_PREFIX=/le-chua,
# SESSION_HTTPS_ONLY=true, HOME_URL=/kinhdich/van-khan, FORWARDED_ALLOW_IPS=<IP docker bridge, vd 172.17.0.1>.

location /le-chua/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;          # ghi âm tối đa 20 MB
    proxy_read_timeout 120s;           # tạo TTS khi nghe thử
}
location = /le-chua { return 301 /le-chua/; }

# MQTT cho thiết bị: mở cổng 8883 (TLS) trong mosquitto.conf, KHÔNG mở 1883 ra internet.
# Có thể dùng chứng chỉ Let's Encrypt của tuandv.id.vn (certfile/keyfile) và mount vào container mosquitto.
