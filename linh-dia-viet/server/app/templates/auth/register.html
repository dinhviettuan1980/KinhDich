{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<h1>Đăng ký</h1>
<div class="ld-card">
  <form method="post" action="{{ u('/dang-ky') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="n">Họ tên</label><input id="n" name="name" type="text" required maxlength="120" value="{{ name|default('') }}">
    <label for="i">Email hoặc số điện thoại</label><input id="i" name="identifier" type="text" required value="{{ identifier|default('') }}">
    <label for="p">Mật khẩu (tối thiểu 8 ký tự)</label><input id="p" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <p><button class="ld-btn block">Tạo tài khoản</button></p>
  </form>
</div>
{% endblock %}
