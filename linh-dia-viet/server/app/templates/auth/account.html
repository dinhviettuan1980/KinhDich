{% extends "base.html" %}
{% block title %}Tài khoản{% endblock %}
{% block content %}
<h1>Tài khoản</h1>
<div class="ld-card"><b>{{ user.name }}</b><br><span class="ld-muted">{{ user.email or user.phone }}</span></div>
<form class="ld-card" method="post" action="{{ u('/tai-khoan/tin-chu') }}">
  <h3>Thông tin tín chủ</h3>
  <p class="ld-muted">Tự điền vào tờ sớ mỗi lần đặt lễ.</p>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="ho_ten">Họ và tên</label><input id="ho_ten" type="text" name="ho_ten" maxlength="120" value="{{ user.devotee_name or '' }}">
  <label for="nam_sinh">Năm sinh (âm lịch)</label><input id="nam_sinh" type="number" name="nam_sinh" min="1900" max="2100" value="{{ user.birth_year or '' }}">
  <label for="dia_chi">Địa chỉ</label><input id="dia_chi" type="text" name="dia_chi" maxlength="300" value="{{ user.address or '' }}">
  <label for="nguyen_vong">Nguyện vọng thường dùng</label><textarea id="nguyen_vong" name="nguyen_vong" maxlength="1000" rows="3">{{ user.wish or '' }}</textarea>
  <p><button class="ld-btn">Lưu</button></p>
</form>
<form class="ld-card" method="post" action="{{ u('/tai-khoan/mat-khau') }}">
  <h3>Đổi mật khẩu</h3>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% if user.password_hash %}<label for="old">Mật khẩu hiện tại</label><input id="old" name="old" type="password" autocomplete="current-password" required>{% endif %}
  <label for="new">Mật khẩu mới (tối thiểu 8 ký tự)</label><input id="new" name="new" type="password" minlength="8" autocomplete="new-password" required>
  <p><button class="ld-btn">Đổi mật khẩu</button></p>
</form>
{% endblock %}
