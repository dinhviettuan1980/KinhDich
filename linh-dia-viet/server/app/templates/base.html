<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Lễ chùa từ xa{% endblock %} · Linh Địa Việt</title>
  <link rel="icon" type="image/png" href="{{ u('/static/icons/favicon-64.png') }}">
  <link rel="manifest" href="{{ u('/manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ u('/static/icons/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#7a1f1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lễ chùa">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="{{ u('/static/ld.css') }}">
  <script src="{{ u('/static/htmx.min.js') }}" defer></script>
  <script src="{{ u('/static/ld.js') }}" defer></script>
</head>
<body style="margin:0">
<div class="ld">
  {% include "_header.html" %}
  <main>
    {% for kind, msg in pop_flash(request) %}<div class="ld-flash {{ kind }}">{{ msg }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% include "_footer.html" %}
  <div class="ld-install" id="ld-install" hidden>
    <img src="{{ u('/static/icons/apple-touch-icon.png') }}" alt="">
    <div><b>Cài "Lễ chùa" lên iPhone</b><br>Bấm <span aria-label="Chia sẻ">⎙ Chia sẻ</span> ở thanh dưới Safari → <b>Thêm vào MH chính</b>.</div>
    <button type="button" aria-label="Đóng" onclick="this.parentNode.hidden=true;try{localStorage.setItem('ld-install-off','1')}catch(e){}">×</button>
  </div>
</div>
</body>
</html>
