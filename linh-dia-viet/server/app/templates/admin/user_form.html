{% extends "base.html" %}
{% block title %}Người dùng{% endblock %}
{% block content %}
<h1>{{ t.name or 'Thêm người dùng' }}</h1>
<form class="ld-card" method="post" action="{{ u('/admin/nguoi-dung/' ~ (t.id or 'moi')) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Họ tên</label><input type="text" name="name" value="{{ t.name or '' }}" required>
  {% if not t.id %}
  <label>Email hoặc số điện thoại</label><input type="text" name="identifier" required>
  <label>Mật khẩu ban đầu</label><input type="password" name="password" minlength="8" required autocomplete="new-password">
  {% else %}<p class="ld-muted">{{ t.email or t.phone }}</p>{% endif %}
  <label>Vai trò</label>
  <select name="role">{% for k, v in roles.items() %}<option value="{{ k }}" {% if k == t.role %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
  <label>Đền phụ trách (cho người bán hàng kiosk / người quản lý đền)</label>
  {% for tp in temples %}<label class="ld-check"><input type="checkbox" name="temple_ids" value="{{ tp.id }}" {% if tp.id in assigned %}checked{% endif %}> {{ tp.name }}</label>{% endfor %}
  <label class="ld-check"><input type="checkbox" name="active" value="1" {% if t.active %}checked{% endif %}> Đang hoạt động</label>
  <p><button class="ld-btn">Lưu</button></p>
</form>
{% endblock %}
