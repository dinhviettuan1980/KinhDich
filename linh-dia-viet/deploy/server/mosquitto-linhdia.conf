# Linh Địa Việt — nạp qua include_dir của /etc/mosquitto/mosquitto.conf
allow_anonymous false
password_file /etc/mosquitto/linhdia.passwd
acl_file /etc/mosquitto/linhdia.acl

# API trên cùng máy
listener 1883 127.0.0.1

# Thiết bị (Raspberry Pi) qua internet
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
